- alias: "Alerta temperatura alta en la cava"
  trigger:
    - platform: numeric_state
      entity_id: sensor.cava_temperatura
      above: 18
      for: "00:00:10"
  action:
    - service: persistent_notification.create
      data:
        title: "⚠️ Cava fuera de rango"
        message: "Temperatura: {{ states('sensor.cava_temperatura') }} °C (máximo 18 °C)"

- alias: "Alerta humedad baja en la cava"
  trigger:
    - platform: numeric_state
      entity_id: sensor.cava_humedad
      below: 55
      for: "00:00:10"
  action:
    - service: persistent_notification.create
      data:
        title: "⚠️ Humedad baja en la cava"
        message: "Humedad: {{ states('sensor.cava_humedad') }} % (mínimo 55 %)"
